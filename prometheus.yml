global:
  scrape_interval: 15s

# use private ports (inner docker network ports)
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: 
        - "localhost:9090"

  - job_name: "node"
    static_configs:
      - targets: 
        - "node-exporter:9100"

  - job_name: "core-api"
    static_configs:
      - targets:
          - "core-api:8000"